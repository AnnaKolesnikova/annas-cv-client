<div class="nav-wrapper main-text-color">
  @if (personalData()) {
    <div class="place-items-start">
      <div class="mb-2 text-4xl font-bold main-text-color">
        {{ personalData()?.fullName }}
      </div>
      <div class="mb-2 text-lg main-text-color">
        {{ personalData()?.title }}
      </div>
    </div>

    <div class="flex flex-row my-4">
      <button mat-fab extended color="success" class="mr-2">
        <mat-icon>email</mat-icon>
        Send email
      </button>
      <button mat-fab extended color="success">
        <mat-icon>download</mat-icon>
        <a
          href="./assets/Ilinchik Anna CV.pdf"
          class="btn"
          target="_blank"
          download="Ilinchik Anna CV.pdf"
        >
          Download CV
        </a>
      </button>
      <div class="example-flex-container">
        <div class="example-button-container"></div>
      </div>
    </div>
  }
  <nav class="nav-menu">
    @for (link of links; track link) {
      <a href="#about" class="nav-link"
        >{{ link }}<span class="nav-line"></span
      ></a>
    }
  </nav>

  @if ((isMobile | async) === false; as isMobile) {
    <div class="social-icons">
      <a
        href="https://github.com/AnnaKolesnikova"
        target="_blank"
        class="icon-link"
      >
        <i class="fab fa-github"></i>
      </a>
      <a
        href="https://linkedin.com/in/anna-ilinchik-18a574b6/"
        target="_blank"
        class="icon-link"
      >
        <i class="fab fa-linkedin"></i>
      </a>
    </div>
  }
</div>
